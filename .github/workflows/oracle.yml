name: Oracle CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "clouds/oracle/**"
      - ".github/workflows/oracle.yml"
  pull_request:
    paths:
      - "clouds/oracle/**"
      - ".github/workflows/oracle.yml"
  workflow_dispatch:
  workflow_call:

env:
  NODE_VERSION: 20.19
  PYTHON3_VERSION: 3.10.13
  VIRTUALENV_VERSION: 20.15.1
  GCLOUD_VERSION: 500.0.0

jobs:

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 55
    env:
      ORA_PREFIX: CI_${{ github.run_id }}_${{ github.run_attempt }}_
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Check diff
        uses: technote-space/get-diff-action@v6
      - name: Auth google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1086647180948/locations/global/workloadIdentityPools/github-actions-pool/providers/github-analytics-toolbox
          service_account: carto-at-gh-actions@cartodb-on-gcp-terraform-ci-cd.iam.gserviceaccount.com
      - name: Retrieve secrets
        id: get-gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            ORA_USER:${{ secrets.ORA_USER_NAME_CI }}
            ORA_PASSWORD:${{ secrets.ORA_PASSWORD_NAME_CI }}
            ORA_WALLET_ZIP:${{ secrets.ORA_WALLET_ZIP_NAME_CI }}
            ORA_WALLET_PASSWORD:${{ secrets.ORA_WALLET_PASSWORD_NAME_CI }}
            ORA_CONNECTION_STRING:${{ secrets.ORA_CONNECTION_STRING_NAME_CI }}
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Setup python 3
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON3_VERSION }}
      - name: Setup virtualenv
        run: pip install virtualenv==${{ env.VIRTUALENV_VERSION }}
      - name: Run linter
        run: |
          cd clouds/oracle
          make lint
      - name: Run deploy
        env:
          ORA_USER: ${{ steps.get-gcp-secrets.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.get-gcp-secrets.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make deploy diff="$GIT_DIFF"
      - name: Run test
        env:
          ORA_USER: ${{ steps.get-gcp-secrets.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.get-gcp-secrets.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make test diff="$GIT_DIFF"
      - name: Run remove
        if: always()
        env:
          ORA_USER: ${{ steps.get-gcp-secrets.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.get-gcp-secrets.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make remove drop-schema=1

  deploy-internal:
    if: github.ref_name == 'main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    strategy:
      matrix:
        target: [cd, ci]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Check diff
        uses: technote-space/get-diff-action@v6
      - name: Auth google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1086647180948/locations/global/workloadIdentityPools/github-actions-pool/providers/github-analytics-toolbox
          service_account: carto-at-gh-actions@cartodb-on-gcp-terraform-ci-cd.iam.gserviceaccount.com
      - name: Retrieve secrets (CI)
        if: matrix.target == 'ci'
        id: get-gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            ORA_USER:${{ secrets.ORA_USER_NAME_CI }}
            ORA_PASSWORD:${{ secrets.ORA_PASSWORD_NAME_CI }}
            ORA_WALLET_ZIP:${{ secrets.ORA_WALLET_ZIP_NAME_CI }}
            ORA_WALLET_PASSWORD:${{ secrets.ORA_WALLET_PASSWORD_NAME_CI }}
            ORA_CONNECTION_STRING:${{ secrets.ORA_CONNECTION_STRING_NAME_CI }}
      - name: Retrieve secrets (CD)
        if: matrix.target == 'cd'
        id: get-gcp-secrets-cd
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            ORA_DB_CREDENTIALS:projects/carto-terraform-ci-cd/secrets/carto-dev-database-credentials
      - name: Extract Oracle credentials (CD)
        if: matrix.target == 'cd'
        id: ora-creds
        env:
          ORA_DB_CREDENTIALS: ${{ steps.get-gcp-secrets-cd.outputs.ORA_DB_CREDENTIALS }}
        run: |
          set -eu
          extract() {
            key="$1"; name="$2"
            value="$(jq -er ".databases.oracle.config.credentials.${key}" <<< "${ORA_DB_CREDENTIALS}")" || {
              echo "Missing '${key}' at databases.oracle.config.credentials in credentials JSON" >&2
              exit 1
            }
            echo "::add-mask::${value}"
            {
              echo "${name}<<__OUT__"
              echo "${value}"
              echo "__OUT__"
            } >> "${GITHUB_OUTPUT}"
          }
          extract user ORA_USER
          extract password ORA_PASSWORD
          extract walletZip ORA_WALLET_ZIP
          extract walletPassword ORA_WALLET_PASSWORD
          extract connectionString ORA_CONNECTION_STRING
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Setup python 3
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON3_VERSION }}
      - name: Setup virtualenv
        run: pip install virtualenv==${{ env.VIRTUALENV_VERSION }}
      - name: Run deploy
        env:
          ORA_USER: ${{ steps.get-gcp-secrets.outputs.ORA_USER || steps.ora-creds.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_PASSWORD || steps.ora-creds.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_ZIP || steps.ora-creds.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.get-gcp-secrets.outputs.ORA_WALLET_PASSWORD || steps.ora-creds.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.get-gcp-secrets.outputs.ORA_CONNECTION_STRING || steps.ora-creds.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make deploy production=1

  publish:
    if: github.ref_name == 'stable'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PACKAGE_BUCKET: gs://carto-analytics-toolbox-core/oracle
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Auth google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_PRODUCTION_RELEASE_SA }}
          project_id: ${{ secrets.GCLOUD_PRODUCTION_PROJECT }}
          create_credentials_file: true
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
            version: ${{ env.GCLOUD_VERSION }}
            project_id: ${{ secrets.GCLOUD_PRODUCTION_PROJECT }}
      - name: Create package
        run: |
          cd clouds/oracle
          make create-package
      - name: Publish package
        run: |
          cd clouds/oracle
          gsutil -h "Content-Type:application/zip" -m cp dist/*.zip ${{ env.PACKAGE_BUCKET }}/
          gsutil -h "Content-Type:application/zip" -m cp dist/*.zip ${{ env.PACKAGE_BUCKET }}/carto-analytics-toolbox-core-oracle-latest.zip
          gsutil -h "Content-Type:application/json" -m cp dist/*.json ${{ env.PACKAGE_BUCKET }}/
