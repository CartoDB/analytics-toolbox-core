name: Oracle dedicated env

on:
  pull_request:
    types: [closed, unlabeled, labeled, synchronize]

env:
  NODE_VERSION: 20.19
  PYTHON3_VERSION: 3.10.13
  VIRTUALENV_VERSION: 20.15.1

jobs:

  dedicated:
    if: |
      github.event.label.name == 'dedicated_oracle' ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'dedicated_oracle')) ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'dedicated_oracle'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Auth google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1086647180948/locations/global/workloadIdentityPools/github-actions-pool/providers/github-analytics-toolbox
          service_account: carto-at-gh-actions@cartodb-on-gcp-terraform-ci-cd.iam.gserviceaccount.com
      - name: Retrieve secrets (CD)
        id: get-gcp-secrets-cd
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            ORA_DB_CREDENTIALS:projects/carto-terraform-ci-cd/secrets/carto-dev-database-credentials
      - name: Extract Oracle credentials (CD)
        id: ora-creds
        env:
          ORA_DB_CREDENTIALS: ${{ steps.get-gcp-secrets-cd.outputs.ORA_DB_CREDENTIALS }}
        run: |
          set -eu
          extract() {
            key="$1"; name="$2"
            value="$(jq -er ".databases.oracle.config.credentials.${key}" <<< "${ORA_DB_CREDENTIALS}")" || {
              echo "Missing '${key}' at databases.oracle.config.credentials in credentials JSON" >&2
              exit 1
            }
            echo "::add-mask::${value}"
            {
              echo "${name}<<__OUT__"
              echo "${value}"
              echo "__OUT__"
            } >> "${GITHUB_OUTPUT}"
          }
          extract user ORA_USER
          extract password ORA_PASSWORD
          extract walletZip ORA_WALLET_ZIP
          extract walletPassword ORA_WALLET_PASSWORD
          extract connectionString ORA_CONNECTION_STRING
      - name: Set ORA_PREFIX
        run: echo "ORA_PREFIX=DEDICATED_CORE_${{ github.event.pull_request.number }}_" >> $GITHUB_ENV
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup yarn
        run: npm install -g yarn
      - name: Setup python 3
        uses: actions/setup-python@v2
        with:
          python-version: ${{ env.PYTHON3_VERSION }}
      - name: Setup virtualenv
        run: pip install virtualenv==${{ env.VIRTUALENV_VERSION }}
      - name: Run deploy
        id: deploy
        if: github.event.action == 'synchronize' || github.event.action == 'labeled'
        env:
          ORA_USER: ${{ steps.ora-creds.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.ora-creds.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.ora-creds.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.ora-creds.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.ora-creds.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make deploy
      - name: Run remove
        id: remove
        if: github.event.action == 'unlabeled' || github.event.action == 'closed'
        env:
          ORA_USER: ${{ steps.ora-creds.outputs.ORA_USER }}
          ORA_PASSWORD: ${{ steps.ora-creds.outputs.ORA_PASSWORD }}
          ORA_WALLET_ZIP: ${{ steps.ora-creds.outputs.ORA_WALLET_ZIP }}
          ORA_WALLET_PASSWORD: ${{ steps.ora-creds.outputs.ORA_WALLET_PASSWORD }}
          ORA_CONNECTION_STRING: ${{ steps.ora-creds.outputs.ORA_CONNECTION_STRING }}
        run: |
          cd clouds/oracle
          make remove drop-schema=1
      - name: Comment deploy PR
        if: steps.deploy.outcome == 'success' && github.event.action == 'labeled'
        uses: thollander/actions-comment-pull-request@v1
        with:
          message: |
            ✅ Dedicated Oracle environment deployed: schema `${{ env.ORA_PREFIX }}CARTO`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment remove PR
        if: steps.remove.outcome == 'success' && (github.event.action == 'unlabeled' || github.event.action == 'closed')
        uses: thollander/actions-comment-pull-request@v1
        with:
          message: |
            🧹 Dedicated Oracle environment removed: schema `${{ env.ORA_PREFIX }}CARTO`
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
